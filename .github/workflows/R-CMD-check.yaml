on:
  # CI is manual-only. Automatic push/PR triggers were burning the
  # 2000 min/month Actions quota during rapid fixup sweeps (a
  # macOS-latest cell alone costs 10x the wall-clock time). To run
  # a check: GitHub Actions tab -> R-CMD-check -> Run workflow.
  workflow_dispatch:

name: R-CMD-check

# Cancel any older run of this workflow for the same ref when a new
# push arrives. A rapid succession of fix commits (as happens during
# an audit sweep) used to bill every superseded run to completion.
concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # Cost-tuned default matrix. macOS was dropped because
          # macos-latest has a 10x billing multiplier (a single 7-minute
          # run costs 70 billable minutes on a 2000-min/month plan) --
          # it used to burn ~70% of every push. When you need macOS
          # coverage, either (a) run the rhub workflow manually or
          # (b) trigger this workflow via workflow_dispatch after
          # temporarily re-adding macos-latest below.
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
