name: Alpha tester feedback
description: Structured feedback from an internal test drive.
title: "[Feedback] "
labels: ["feedback", "alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for test-driving `screenllm`. This form takes about 3 minutes.

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. "macOS 14.5 (M2, 16 GB RAM)", "Windows 11 (i7, 32 GB)", "Ubuntu 22.04"
    validations:
      required: true

  - type: dropdown
    id: preset
    attributes:
      label: Which preset did you use?
      options:
        - Light (~10 GB, 4 small models)
        - Paper (~65 GB, 4 large models)
        - Custom
        - Didn't get that far
    validations:
      required: true

  - type: dropdown
    id: got-to
    attributes:
      label: How far did you get?
      options:
        - Couldn't install R / RStudio
        - Installed R but couldn't install screenllm
        - Installed screenllm but Ollama setup failed
        - Ollama worked but couldn't launch the app
        - Launched the app, tried the toy corpus
        - Went further and tried my own corpus
    validations:
      required: true

  - type: textarea
    id: what-worked
    attributes:
      label: What worked well
      description: Anything you found intuitive, delightful, or surprising in a good way.
      placeholder: "The pilot output was much easier to read than I expected..."
    validations:
      required: false

  - type: textarea
    id: what-broke
    attributes:
      label: What didn't work or was confusing
      description: |
        Be as specific as you can. If you got an error message, paste it
        verbatim. Which step (from the getting-started guide) tripped you
        up?
      placeholder: "On step 4 when I ran install_prereqs, it said..."
    validations:
      required: true

  - type: textarea
    id: time
    attributes:
      label: Rough time budget
      description: How long did you spend on install vs on trying the tool?
      placeholder: "~45 min install (Ollama download was slow), ~30 min trying"
    validations:
      required: false

  - type: dropdown
    id: would-use
    attributes:
      label: Would you use this for a real review?
      options:
        - Yes, as soon as it's on CRAN
        - Yes, but only after these changes (describe below)
        - Probably not (describe below)
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: missing
    attributes:
      label: What was missing?
      description: Features, docs, examples, anything.
      placeholder: "A one-click way to import from EndNote..."
    validations:
      required: false

  - type: input
    id: name
    attributes:
      label: Your name (optional)
      description: For crediting in the acknowledgements. Leave blank to stay anonymous.
    validations:
      required: false
